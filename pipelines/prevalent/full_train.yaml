extends: ../../configs/defaults.yaml
task: prevalent
module_data:
  catalog_path: ${TRACE_MODULE_CATALOG} # Module, outcome and selected-feature input catalog
  input_mode: modules
  score_mode: training
data:
  input_dir: ${TRACE_INPUT_DIR} # Target and score arrays generated by this workflow
  prefix: ${TRACE_INPUT_PREFIX}
  split_table:
    path: ${TRACE_SPLIT_TABLE} # Complete preassigned participant_id,split table; row_index is optional
    row_index_column: row_index
    participant_id_column: participant_id
    split_column: split
training:
  modules:
    seed: 7
    min_positive: 50
    min_positive_rate: 0.001
    insufficient_data_policy: skip
    n_estimators: 100
    learning_rate: 0.1
    n_jobs: 1
    num_leaves: 31
    min_child_samples: 20
  integration:
    seed: 7
    subsets_per_participant: 4
    min_class_count: 10
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 63
    n_jobs: 1
  calibration:
    min_class_count: 10
  planner:
    seed: 7
    states_per_participant: 2
    candidate_actions: 6
    lambda_cost: 0.01
    stop_value_mode: fixed_zero
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 20
    n_jobs: 1
artifacts:
  module_model_dir: ${TRACE_MODULE_MODEL_DIR} # Module model bank and train OOF cache output
  fusion_model: ${TRACE_OUTPUT_DIR}/fusion_model.joblib
  calibrators: ${TRACE_OUTPUT_DIR}/calibration_model.joblib
  q_model: ${TRACE_OUTPUT_DIR}/q_model.joblib
  knowledge_matrix: ${TRACE_KNOWLEDGE_MATRIX} # M-by-D module/endpoint knowledge matrix
  burden_profile: ../../resources/burden/ukb_relative.yaml # Must cover actual module names; override with a profile when needed
output:
  directory: ${TRACE_OUTPUT_DIR}
pipeline:
  steps: [prepare-data, train-modules, score-modules, train-integration, calibrate, train-planner]
