extends:
  - ../../pipelines/prevalent/infer.yaml
  - prevalent-train.yaml
# Model paths come from prevalent-train.yaml; scoring never opens outcomes or splits.
module_data:
  catalog_path: ../../data/configs/new_catalog.yaml
  score_mode: inference
data:
  input_dir: ../../data/study/prevalent/new_scores
  prefix: new
  split_table: null
output:
  directory: ../../data/study/prevalent/predictions
pipeline:
  steps: [score-modules, infer]
