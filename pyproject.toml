[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-agent"
version = "0.1.0"
description = "TRACE: evidence-guided trajectory planning for multi-disease classification and incident risk prediction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "lightgbm==4.6.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/Drizzle-Zhang/TRACE"

[project.optional-dependencies]
longitudinal = ["xgboost>=2.0"]
io = ["datatable>=1.1", "pyarrow>=14"]
explain = ["shap>=0.44"]
llm = ["openai>=1.0"]
moe = ["torch>=2.0"]
dev = [
  "tomli>=2.0; python_version < '3.11'",
  "black>=24",
  "isort>=5",
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
  "torch>=2.0",
]
all = [
  "black>=24",
  "datatable>=1.1",
  "isort>=5",
  "mypy>=1.10",
  "openai>=1.0",
  "pyarrow>=14",
  "pytest>=8",
  "ruff>=0.6",
  "shap>=0.44",
  "types-PyYAML>=6.0",
  "xgboost>=2.0",
]

[project.scripts]
trace = "trace_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 110

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
